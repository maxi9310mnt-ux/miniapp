<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Запись на тренировку</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Экран 1: Регистрация -->
    <div id="screen-register" class="screen active">
      <h1>👋 Привет!</h1>
      <p id="welcome-text">Загрузка...</p>
      <label for="name-input">Как тебя зовут?</label>
      <input type="text" id="name-input" placeholder="Имя и фамилия" maxlength="50">
      <button id="btn-save-name" class="btn-primary">Сохранить</button>
    </div>

    <!-- Экран 2: Категория -->
    <div id="screen-category" class="screen">
      <h1>🎯 Выбери направление</h1>
      <div id="category-list"></div>
    </div>

    <!-- Экран 3: Тренер -->
    <div id="screen-trainer" class="screen">
      <h1>👤 Выбери тренера</h1>
      <div id="trainer-list"></div>
      <button id="btn-back-to-cat" class="btn-secondary">← Назад</button>
    </div>

    <!-- Экран 4: Календарь -->
    <div id="screen-date" class="screen">
      <h1>📅 Выбери дату</h1>
      <div id="calendar-container"></div>
      <button id="btn-back-to-trn" class="btn-secondary">← Назад</button>
    </div>

    <!-- Экран 5: Время -->
    <div id="screen-time" class="screen">
      <h1>🕐 Выбери время</h1>
      <div id="time-list"></div>
      <button id="btn-back-to-date" class="btn-secondary">← Назад</button>
    </div>

    <!-- Экран 6: Подтверждение -->
    <div id="screen-success" class="screen">
      <h1>✅ Записано!</h1>
      <p id="success-text"></p>
      <button id="btn-done" class="btn-primary">Готово</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
